<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pokémon TCG Simulador · Overgrowth vs Blackout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Pokémon TCG Simulador</h1>
    <span id="matchResult" class="match-result"></span>
    <div id="coin-display">Monedas: <span id="coin-count">--</span></div>
    <button type="button" id="musicToggle" class="action-btn">🔈 Música</button>
    <nav class="tabs">
      <button type="button" id="tabBtnPlay" class="active">Jugar</button>
      <button type="button" id="surrenderBtn" class="action-btn">Rendirse</button>
      <button type="button" id="tabBtnCollection">Colección</button>
    </nav>
  </header>

  <audio id="bgMusic" src="Songs/YGO-Free%20Duel.mp3" loop preload="none"></audio>

  <main>
    <section id="panelPlay" class="tab-panel active play-layout">
      <aside id="log-panel">
        <h4>Registro</h4>
        <pre id="log"></pre>
      </aside>
      <div id="app">Cargando...</div>
    </section>
    <section id="panelCollection" class="tab-panel">
      <div id="booster-shop"></div>
      <div id="collection-view"></div>
    </section>
  </main>

  <div id="cardModal" class="card-modal hidden">
    <div class="card-modal-backdrop"></div>
    <div class="card-modal-content">
      <img id="cardModalImg" src="" alt="">
      <button type="button" id="cardModalClose" class="action-btn">Cerrar</button>
    </div>
  </div>

  <div id="surrenderModal" class="card-modal hidden">
    <div class="card-modal-backdrop"></div>
    <div class="card-modal-content">
      <p>¿Seguro que querés rendirte? Esto le dará la victoria al rival.</p>
      <div>
        <button type="button" id="surrenderConfirmBtn" class="action-btn">Sí</button>
        <button type="button" id="surrenderCancelBtn" class="action-btn">No</button>
      </div>
    </div>
  </div>

<script src="data-sets.js"></script>
<script src="data-decks.js"></script>
<script src="data-cards.js"></script>
<script src="rules-engine.js"></script>
<script src="card-effects.js"></script>
<script src="ai.js"></script>
<script src="economy.js"></script>
<script src="ui.js"></script>
</body>
</html>
